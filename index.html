<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ObjectSleuth</title>
  <meta name="description" content="ObjectSleuth – a 3D hidden-objects game. Draft 1.">
  <meta name="theme-color" content="#1b1f2a">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPad / iPhone home-screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ObjectSleuth">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <!-- lets the bundled Three.js add-ons find Three.js (all files are local) -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
</head>
<body>
  <canvas id="stage" aria-label="The Estate – Study"></canvas>

  <header id="topbar">
    <div class="brand">Object<span>Sleuth</span> <b id="scene" class="scenepill">THE ESTATE · STUDY</b> <b id="ver" class="ver" title="Build number">v–</b></div>
    <div class="seg" role="group" aria-label="Lighting">
      <button type="button" data-preset="auto" title="Follows the clock">🕰️ Auto</button>
      <button type="button" data-preset="day">☀️ Day</button>
      <button type="button" data-preset="dusk">🌇 Dusk</button>
      <button type="button" data-preset="night">🕯️ Night</button>
      <button type="button" id="overhead" aria-pressed="false" title="Ceiling light on / off">💡 Overhead</button>
    </div>
  </header>

  <!-- TEST TOOLS: each folds into a small pill (hover to peek, click/tap to pin open or closed) -->
  <div id="tools">
    <div class="tool" id="tool-style">
      <button type="button" class="pill" aria-expanded="false">🎨 STYLE: <span id="pill-style">–</span></button>
      <div class="body">
        <select id="style" aria-label="Art style"></select>
        <button type="button" id="mini" aria-pressed="false" title="Tilt-shift: looks like a tiny model">🔍 Miniature</button>
      </div>
    </div>
    <div class="tool" id="tool-quality">
      <button type="button" class="pill" aria-expanded="false">⚙️ QUALITY: <span id="pill-quality">–</span></button>
      <div class="body">
        <select id="quality" aria-label="Quality" title="Auto adjusts itself to keep the game smooth and cool"></select>
      </div>
    </div>
    <div class="tool" id="tool-clock">
      <button type="button" class="pill" aria-expanded="false">🕰️ TEST CLOCK: <span id="pill-clock">--:--</span></button>
      <div class="body">
        <input type="range" id="tc-range" min="0" max="23.98" step="0.0167" aria-label="Time of day">
        <span id="tc-time">--:--</span>
        <button type="button" id="tc-play" aria-label="Time-lapse" title="Time-lapse: 1 hour every 4 seconds">⏩</button>
        <button type="button" id="tc-live" title="Back to the real clock">Live</button>
      </div>
    </div>
  </div>

  <!-- FIND panel: drag by its header, resize by its grip, fold with the chevron -->
  <aside id="findpanel" class="side" role="region" aria-label="Find the Objects">
    <div class="fp-head" id="fp-head" title="Drag to move">
      <span class="fp-title">Find the Objects</span>
      <span class="fp-count" id="fp-count">0 / 6</span>
      <button type="button" id="fp-toggle" class="fp-chev" aria-expanded="true" aria-label="Fold or unfold the list">▾</button>
    </div>
    <div class="fp-body">
      <p class="fp-intro">Explore the scene by zooming in/out, panning around, and selecting each of the hidden objects.</p>
      <div class="fp-progress"><span>DISCOVERED</span><b id="fp-done">0 / 6</b></div>
      <div class="fp-bar"><i id="fp-bar"></i></div>
      <ul id="findlist"></ul>
      <p id="findmsg" hidden></p>
      <div class="fp-foot">
        <select id="chal" aria-label="Challenge level" title="How well the objects are hidden"></select>
        <button type="button" id="newround" class="restart" title="Hide the objects somewhere new">Restart Scene</button>
      </div>
    </div>
    <div class="fp-grip" id="fp-grip" title="Drag to resize"></div>
  </aside>

  <div id="hintbar" role="group" aria-label="Hints">
    <button type="button" id="reveal1" title="Show one object you haven't found yet">👁️ Reveal 1</button>
    <button type="button" id="revealall" title="Show all the objects you haven't found yet">👁️ Reveal All</button>
  </div>

  <div id="zoombar" role="group" aria-label="Zoom">
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    <span id="zoom-label">×1.0</span>
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" id="zoom-reset" aria-label="Show whole room">⤢</button>
  </div>

  <div id="info"><span id="build"></span> · <span id="fps">– fps</span> · <span id="offline">…</span></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
